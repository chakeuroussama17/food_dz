<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="foodfennec: commandez vos plats préférés · اطلب أطباقك المفضلة">
  <meta name="theme-color" content="#FFFFFF">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="foodfennec">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>foodfennec</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    /* Splash Page_01 from Figma, shown instantly while Flutter downloads
       (can take several seconds on a slow connection). */
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #FFFFFF; transition: opacity .25s ease-out;
    }
    #splash img { width: 180px; height: auto; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #121223; }
    }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash"><img src="splash.png" alt="foodfennec"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
